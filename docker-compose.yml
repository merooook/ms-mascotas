services:
  mascotas:
    build: .
    container_name: ms-mascotas
    restart: unless-stopped
    environment:
      SPRING_MVC_SERVLET_PATH: /api/v1
      MONGODB_URI: ${MONGODB_URI}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      COGNITO_ISSUER_URI: https://cognito-idp.us-east-1.amazonaws.com/${COGNITO_USER_POOL_ID}
      COGNITO_JWK_SET_URI: https://cognito-idp.us-east-1.amazonaws.com/${COGNITO_USER_POOL_ID}/.well-known/jwks.json
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # Secreto compartido con ms-alertas y ms-chat para los endpoints /internal/** (header X-Internal-Token).
      # Sin valor, esos endpoints rechazan todo. Debe ser el MISMO en los tres servicios.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Define INTERNAL_API_TOKEN en .env (minimo 32 caracteres)}
      SWAGGER_ENABLED: "true"   # solo en local
      # LocalStack (lo levanta ms-alertas en su docker-compose.yml, en la red
      # compartida) en vez de AWS real para SNS — así no depende de la sesión
      # del lab. S3 sigue usando las credenciales reales de arriba: ver la
      # nota en SnsConfig.java sobre por qué no se mezclan.
      AWS_REGION: us-east-1
      AWS_ENDPOINT_OVERRIDE: http://ms-alertas-localstack:4566
      AWS_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:sanos-eventos
    ports:
      # solo accesible desde esta maquina: los demas servicios llegan por la red de Docker.
      # Publicado en 0.0.0.0 cualquiera de la red podia llamar al servicio directamente.
      - "127.0.0.1:8082:8082"
    networks:
      - sanos-y-salvos-network

networks:
  sanos-y-salvos-network:
    external: true
    name: sanos-y-salvos-network
